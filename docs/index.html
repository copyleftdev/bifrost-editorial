<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migrating from Legacy LLM Infrastructure to an Enterprise AI Gateway</title>
<meta name="description" content="A hands-on migration story — moving a support copilot off direct provider calls onto an enterprise AI gateway, with measured cost and failover results.">
<style>
  body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; font-family: -apple-system, system-ui, sans-serif; line-height: 1.6; color: #1a1a1a; }
  img { max-width: 100%; border-radius: 8px; }
  pre { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 8px; overflow-x: auto; }
  code { font-family: ui-monospace, monospace; font-size: 0.9em; }
  table { border-collapse: collapse; } td, th { border: 1px solid #cbd5e1; padding: 0.4rem 0.8rem; }
  a { color: #2563eb; }
</style>
</head>
<body>
<article id="content">Loading…</article>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
fetch('article.md').then(r => r.text()).then(md => {
  // strip YAML front matter for the page render
  const body = md.replace(/^---[\s\S]*?---\n/, '');
  document.getElementById('content').innerHTML = marked.parse(body);
});
</script>
</body>
</html>
